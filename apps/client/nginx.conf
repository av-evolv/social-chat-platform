server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /oauth/callback {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /oauth/callback.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
