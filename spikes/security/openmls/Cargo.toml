[package]
name = "larynx-security-spike"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
openmls = { version = "=0.9.0", features = ["js"] }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
wasm-bindgen = "=0.2.126"
# The RustCrypto provider still uses the 0.2 randomness API.
getrandom = { version = "=0.2.17", features = ["js"] }
